<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 작성 — devlog</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute(
                'data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand" aria-label="devlog 홈">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <span class="brand-name">devlog<span class="cursor">_</span></span>
            </a>
            <div class="header-actions">
                <nav class="site-nav" aria-label="주요 메뉴">
                    <ul id="nav-list">
                        <li><a class="nav-link" href="index.html">홈</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container container--narrow">
            <article class="form-card">
                <div class="form-card__head">
                    <span class="form-card__kicker">// new article</span>
                    <h1 class="form-card__title">새 글 작성</h1>
                    <p class="form-card__desc">오늘 배운 것을 기록해 보세요. 코드는 ```로 감싸면 코드 블록으로 표시됩니다.</p>
                </div>

                <form id="new-post-form">
                    <div class="form-group">
                        <label for="post-title">제목 <span class="req" aria-hidden="true">*</span></label>
                        <input class="form-control" type="text" id="post-title" name="title"
                            placeholder="예) React useEffect 정리 함수 동작 원리" required>
                    </div>
                    <div class="form-group">
                        <label for="post-author">작성자 <span class="hint">선택</span></label>
                        <input class="form-control" type="text" id="post-author" name="author"
                            placeholder="익명으로 표시됩니다">
                    </div>
                    <div class="form-group">
                        <label for="post-content">내용 <span class="req" aria-hidden="true">*</span>
                            <span class="hint">Markdown-ish</span>
                        </label>
                        <textarea class="form-control" id="post-content" name="content" rows="15"
                            placeholder="무엇을 배웠고, 어떻게 해결했는지 적어 보세요..."
                            required></textarea>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn--ghost" href="index.html">취소</a>
                        <button type="submit" class="btn btn--primary">게시물 작성</button>
                    </div>
                </form>
            </article>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-copy">&copy; 2026 devlog. Built with curiosity.</p>
            <ul class="footer-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="create-post.html">글 작성</a></li>
            </ul>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>

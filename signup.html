<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입하기 — devlog</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute(
                'data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth">
    <div class="auth-wrap">
        <div class="auth-topbar">
            <a href="index.html" class="brand" aria-label="devlog 홈">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <span class="brand-name">devlog<span class="cursor">_</span></span>
            </a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
            </button>
        </div>

        <div class="auth-card">
            <div class="auth-card__brand">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <div>
                    <h1 class="auth-title">블로그 시작하기</h1>
                    <p class="auth-subtitle">계정을 만들고 첫 글을 발행해 보세요.</p>
                </div>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="username">사용자 이름 <span class="req" aria-hidden="true">*</span></label>
                    <input class="form-control" type="text" id="username" name="username"
                        placeholder="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호 <span class="req" aria-hidden="true">*</span></label>
                    <input class="form-control" type="password" id="password" name="password"
                        placeholder="8자 이상 입력하세요" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn--primary btn--block">가입하고 시작하기</button>
            </form>

            <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

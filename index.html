<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="코드와 생각을 기록하는 개발 블로그">
    <title>devlog — 개발 블로그</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand" aria-label="devlog 홈">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <span class="brand-name">devlog<span class="cursor">_</span></span>
            </a>

            <div class="header-actions">
                <nav class="site-nav" aria-label="주요 메뉴">
                    <ul id="nav-list">
                        <!-- 내비게이션은 app.js가 세션 상태에 따라 렌더링합니다. -->
                        <li><a class="nav-link is-active" href="index.html">홈</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle" id="theme-toggle" type="button"
                    aria-label="라이트/다크 테마 전환">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- 히어로 섹션 -->
            <section class="hero">
                <p class="hero-kicker">// 안녕하세요, 개발자입니다</p>
                <h1 class="hero-title">
                    <span class="gradient-text">코드</span>와 생각을<br>
                    기록하는 기술 블로그
                </h1>
                <p class="hero-desc">
                    웹 개발과 프로그래밍에 대한 배운 점, 겪은 버그, 그리고 오래 기억하고 싶은 이야기를
                    정리합니다. 실수하며 성장한 기록을 다른 개발자와 나눕니다.
                </p>
                <div class="hero-stats">
                    <span class="stat-chip"><span class="dot" aria-hidden="true"></span>
                        <strong id="stat-posts">0</strong> posts</span>
                    <span class="stat-chip">topics: web, javascript</span>
                    <span class="stat-chip">since 2026</span>
                </div>
            </section>

            <!-- 글 목록 -->
            <div class="section-head">
                <h2 class="section-title"><span class="hash">#</span>최근 글</h2>
                <span class="section-note" id="posts-count">0 articles</span>
            </div>

            <div class="posts" id="posts-container">
                <!-- 목록은 app.js가 localStorage에서 불러와 렌더링합니다. -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-copy">&copy; 2026 devlog. Built with curiosity.</p>
            <ul class="footer-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="create-post.html">글 작성</a></li>
            </ul>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
